[project]
name = "searchdrift"
version = "0.1.0"
description = "Benchmarks search APIs over time and detects real drift beyond noise."
readme = "README.md"
authors = [
    { name = "Raj Nair", email = "nraj00954@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, B: common bugs,
# UP: modern Python syntax, ASYNC: asyncio mistakes (e.g. blocking calls in async code)
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
